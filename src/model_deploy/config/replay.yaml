# 机械臂轨迹回放；SDK/固件/CAN/物理限位从 act.yaml 读取。
# bag 只读取从臂实测状态；不发布 bag 的其他话题，不加载模型。
rate: 0.5                     # 相对录制速度；1=原速，0.5=半速。
command_hz: 50                # 轨迹重采样和 SDK 下发频率。
sdk_speed_percent: 20         # SDK 运动速度比例；与下面目标推进限速同时生效。
joint_speed_rad_s: 0.60
gripper_speed_m_s: 0.03
max_source_gap_sec: 0.10      # 任一状态源缺口超过此值则拒绝整条轨迹。
max_clock_skew_sec: 2.0       # header 与 bag 接收时间偏差上限。
start_tolerance_rad: 0.15    # 起点检查；--move-to-start 到位后也会再次检查。
start_tolerance_m: 0.015
tracking_tolerance_rad: 0.04 # 未跟上时等待当前路点，不跳帧追赶。
tracking_tolerance_m: 0.004
waypoint_timeout_sec: 10.0   # 当前路点受阻/无法到达时停止。
final_settle_sec: 0.50       # 最终位置连续到位后才报告完成。
startup_timeout_sec: 10.0
approach_joint_speed_rad_s: 0.20 # --move-to-start：关节插值速度上限，约 11.5 度/s。
approach_gripper_speed_m_s: 0.01 # 同时将夹爪移到 bag 起始开口，最多 10 mm/s。
approach_timeout_sec: 30.0       # 到起点整个阶段超时；失败不进入回放。
topics:
  left_joints: /piper/left_bus/joint_states
  left_gripper: /piper/left_bus/gripper/actual_stamped
  right_joints: /piper/right_bus/joint_states
  right_gripper: /piper/right_bus/gripper/actual_stamped
