schema_version: 1
# checkpoint: ~/AgileX_ws/outputs/act_piper_insert_plug_20261016/checkpoints/028750/pretrained_model
checkpoint: ~/AgileX_ws/outputs/act_piper_insert_plug_v3_all_20261017/checkpoints/028750/pretrained_model
python: ~/miniconda3/envs/lerobot/bin/python
log_dir: ~/AgileX_ws/logs/deploy
policy:
  device: cuda
  fps: 15
  temporal_ensemble_coeff: 0.01
  width: 640
  height: 480
  startup_timeout_sec: 120
  inference_timeout_sec: 0.20
  max_duration_sec: 60
observations:
  camera_skew_sec: 0.05
  image_age_sec: 0.25
  state_age_sec: 0.10
  status_age_sec: 0.30
  joint_alignment_sec: 0.10
  cameras:
    cam_h: /cam_h/color/image_raw
    cam_l: /cam_l/color/image_raw
    cam_r: /cam_r/color/image_raw
  arms:
    left: /piper/left_bus
    right: /piper/right_bus
control:
  # 【设备通信】左右从臂对应的 CAN 口；不要交换，否则模型左右动作会发错机械臂。
  channels: {left: can0, right: can1}
  # CAN 波特率，单位 bit/s；应与 prepare_can.sh 和机械臂配置一致。
  bitrate: 1000000
  # 已实机读到的固件版本；不匹配时拒绝控制。null 表示查询后自动选择 SDK profile。
  expected_firmware: {left: S-V1.9-0, right: S-V1.9-0}
  # 【SDK 运动速度】move_j 的速度比例，整数 1~100（%），不是 rad/s。
  # 与下方 max_joint_speed_rad_s 同时作用；调大其中一个不等于解除另一个限制。
  sdk_speed_percent: 50
  # 【夹爪力度】传给 SDK 的 force 参数；未标定，不能视为实测夹持力或碰撞阈值。
  gripper_force: 1.0
  # 【命令超时停止】已启动控制后，超过此时间没有完成动作下发就请求停止，单位 s。
  # 防止推理/主循环卡住后仍继续推进；与 policy.inference_timeout_sec 不同。
  command_timeout_sec: 0.30
  # 【关节物理范围】每侧 J1~J6 的角度范围，单位 rad，左右共用，并传入 SDK。
  # 用户已确认 J6 为 ±180°。不要把这些数值当作运行偏差门限来放宽。
  joint_min: [-2.617994, 0.0, -2.967060, -1.745330, -1.221730, -3.141592653589793]
  joint_max: [2.617994, 3.141593, 0.0, 1.745330, 1.221730, 3.141592653589793]
  # 【夹爪物理范围】开口宽度，单位 m；0=闭合，0.10=100 mm，用户已确认行程。
  gripper_min: 0.0
  gripper_max: 0.10
  # 【实测反馈越界容差】允许反馈在物理端点附近的微小误差，超出则停止。
  # 0.02 rad≈1.15°；容差内反馈被投影到合法范围，不扩大允许下发的范围。
  boundary_tolerance_rad: 0.10
  # 同上，夹爪单位 m；0.002=2 mm。
  boundary_tolerance_m: 0.010
  # 【模型目标偏差开关】false 时不因原始预测离实测位置较远而停止。
  # 仅关闭这两类额外门限；下发动作仍经过物理范围、逐步限速、实际跟踪检查。
  check_initial_target_error: false  # 启动时的模型目标偏差检查
  check_runtime_target_error: false # 运行中的模型目标偏差检查
  # 【启动姿态检查】check_initial_target_error: true 时检查首次预览及回车后的模型目标偏差。
  # 单位 rad，0.20≈11.5°；同时用于使能握手期间的异常位移检查，后者始终生效。
  max_initial_error_rad: 0.20
  # 启动时夹爪目标偏差，及使能握手期间夹爪异常位移门限；单位 m，0.02=20 mm。
  max_initial_error_m: 0.02
  # 【实际指令跟踪检查】上一次已下发关节目标与当前实测角度的最大差值。
  # 单位 rad；超出报 Follower is not tracking commanded pose。
  # 也限制新下发目标超前当前实测的位置范围，不是模型原始目标门限。
  max_tracking_error_rad: 0.20
  # false：双侧夹爪跟踪偏差超限不再退出；六关节的跟踪检查不受影响。
  check_gripper_tracking_error: false
  # 夹爪目标相对实测开口的范围，单位 m；0.02=20 mm，关闭退出检查后仍约束下发目标。
  # 若反馈突然移动导致超出范围，目标按限速逐步回到范围内，不瞬间跳变。
  max_tracking_error_m: 0.02
  # 【运行中模型目标偏差】原始模型目标与当前实测关节角度的最大差值，单位 rad。
  # 下面两项仅在 check_runtime_target_error: true 时生效；当前已关闭。
  # 报错 Model target too far ... limit=0.5000 对应这一项。
  # 0.50≈28.6°；调大可允许模型目标更超前，但仍受到下面的限速/实际跟踪约束。
  max_target_error_rad: 0.50
  # 同上，夹爪单位 m；0.04=40 mm，不是闭合力度。
  max_target_error_m: 0.08
  # 【程序额外逐步限速】关节目标相对上一次下发值的变化速度上限，单位 rad/s。
  # 15 Hz 下 0.40 对应每步最多约 0.0267 rad≈1.53°；不是 SDK 的速度百分比。
  max_joint_speed_rad_s: 0.40
  # 同上，夹爪开口目标变化速度，单位 m/s；0.03=30 mm/s，每步约 2 mm。
  max_gripper_speed_m_s: 0.03
  # 所有 max_* 和 *_sec 必须为有限正数；当前不支持用 0、负数或 null 关闭检查。
  # 修改后重新运行 deploy.sh 生效；正在运行的进程不热加载，无需重新编译。
  # 图像/反馈过期检查在 observations 段；推理超时在 policy 段。

# 【终端复位】reset.sh 使用；不改变上方模型推理时的控制参数。
reset:
  # 固定回位关节角，左右各 J1~J6，单位 rad；不会随新一次部署而改变。
  # 用户指定左右均为 [0, 0, 0, 0, 24, 0] 度；下方存储对应弧度。
  home_joints_rad:
    left: [0.0, 0.0, 0.0, 0.0, 0.4188790204786391, 0.0]
    right: [0.0, 0.0, 0.0, 0.0, 0.4188790204786391, 0.0]
  # 顺序：打开夹爪 → 允许朝向变化的关节路径抬升 → 回到上述关节姿态 → 闭合。
  vertical_lift:
    mode: joint_path           # 使用位置逆解规划 + move_j；linear 为旧的固定朝向直线模式。
    base_z_is_up: true          # 用户确认两侧底座水平安装，基座 +Z 为竖直向上。
    distance_m: 0.10            # 每次从当前末端位置抬升 10 cm；不是绝对高度。
    speed_m_s: 0.02             # 抬升目标推进速度，2 cm/s；另受复位 SDK 速度约束。
    position_tolerance_m: 0.003 # 抬升位置到位容差，3 mm。
    max_lateral_m: 0.05        # 相对抬升起点的法兰水平偏移上限，5 cm；规划优先保持 XY。
    max_rotation_rad: 0.80     # 允许法兰朝向相对起点改变最多约 46°，不再锁死朝向。
    joint_limit_margin_rad: 0.03 # 在配置和设备限位交集内保留余量；靠近端点的起点只允许向内。
    orientation_tolerance_rad: 0.05 # 仅旧 linear 模式使用。
    max_path_error_m: 0.01      # 向下偏移、超高或法兰目标跟踪偏差超过 1 cm 则停止。
  gripper_open_m: 0.10          # m，100 mm；打开可能释放手中的物体。
  gripper_closed_m: 0.0        # m，闭合；回位后保持闭合，不恢复起始夹爪开口。
  sdk_speed_percent: 20        # 复位的 SDK move_j 速度比例，整数 1~100（%）。
  # 复位轨迹还受 control 的逐步限速和跟踪检查约束，实际取较严格的限制。
  joint_speed_rad_s: 0.30      # 复位轨迹的关节目标变化速度上限，rad/s。
  gripper_speed_m_s: 0.03      # 复位轨迹的夹爪目标变化速度上限，m/s。
  phase_timeout_sec: 30.0      # 每个阶段分别计时；任一步未到位则停止，不进入下一步。
  settle_sec: 0.50             # 实测位置连续保持在到位容差内多久才进入下一阶段，s。
  joint_tolerance_rad: 0.02    # 到位容差，rad≈1.15°，不是物理限位或运行跟踪误差。
  gripper_tolerance_m: 0.003   # 到位容差，m=3 mm。
