# 用 Python 3.12 / lerobot 环境运行，不需要启动 ROS 或机械臂。
# 相对路径以本 YAML 所在目录为基准；支持 ~ 和环境变量。
schema_version: 1
input:
  bag_glob: ../../../bags/task_*/data.bag
  require_complete_manifest: true

dataset:
  repo_id: local/piper_insert_plug
  root: ../../../datasets/piper_insert_plug
  robot_type: piper_dual
  fps: 15
  task: 用双臂将插头插入插座

# 多任务时可按原采集目录覆盖 task；不填写则使用 dataset.task。
tasks: {}
# tasks:
#   task_0001: 用双臂将插头插入插座

sync:
  max_clock_skew_sec: 2.0  # 连续流 header 与 bag 接收时间允许的最大差
  min_frames: 2
  max_pending_frames: 128

# RGB 是有损 H.264 视频；原始 RGB 保留在 bag 中。可改 storage: image 保存无损图像。
video:
  vcodec: h264
  pix_fmt: yuv420p
  crf: 18
  preset: fast
  g: 15

# previous：只取采样时刻及之前的最新值，不使用未来动作。
# nearest：取最近图像，max_age_sec 是允许的绝对时间差。
# hold_last: true / max_age_sec: null 仅用于事件式主臂目标；旧值可能是静止保持，
# 不代表主臂仍在线。其原始年龄和时间戳写入 meta/source，绝不改写为新时间。
sources:
  left_joints:
    topic: /piper/left_bus/joint_states
    timestamp: header
    sample: previous
    max_age_sec: 0.1
    order_field: name
    order: [left_follower_joint_1, left_follower_joint_2, left_follower_joint_3, left_follower_joint_4, left_follower_joint_5, left_follower_joint_6]
  right_joints:
    topic: /piper/right_bus/joint_states
    timestamp: header
    sample: previous
    max_age_sec: 0.1
    order_field: name
    order: [right_follower_joint_1, right_follower_joint_2, right_follower_joint_3, right_follower_joint_4, right_follower_joint_5, right_follower_joint_6]
  left_gripper:
    topic: /piper/left_bus/gripper/actual_stamped
    timestamp: header
    sample: previous
    max_age_sec: 0.1
    order_field: name
    order: [left_follower_gripper_width]
  right_gripper:
    topic: /piper/right_bus/gripper/actual_stamped
    timestamp: header
    sample: previous
    max_age_sec: 0.1
    order_field: name
    order: [right_follower_gripper_width]
  left_target:
    topic: /piper/left_bus/leader_targets
    timestamp: header
    sample: previous
    hold_last: true
    max_age_sec: null
    order_field: name
    order: [left_leader_target_joint_1, left_leader_target_joint_2, left_leader_target_joint_3, left_leader_target_joint_4, left_leader_target_joint_5, left_leader_target_joint_6]
  right_target:
    topic: /piper/right_bus/leader_targets
    timestamp: header
    sample: previous
    hold_last: true
    max_age_sec: null
    order_field: name
    order: [right_leader_target_joint_1, right_leader_target_joint_2, right_leader_target_joint_3, right_leader_target_joint_4, right_leader_target_joint_5, right_leader_target_joint_6]
  left_gripper_target:
    topic: /piper/left_bus/gripper/target_stamped
    timestamp: header
    sample: previous
    hold_last: true
    max_age_sec: null
    order_field: name
    order: [left_leader_target_gripper_width]
  right_gripper_target:
    topic: /piper/right_bus/gripper/target_stamped
    timestamp: header
    sample: previous
    hold_last: true
    max_age_sec: null
    order_field: name
    order: [right_leader_target_gripper_width]
  left_motor:
    topic: /piper/left_bus/motor_feedback
    timestamp: header
    sample: previous
    max_age_sec: 0.1
    order_field: joint_order
    order: [1, 2, 3, 4, 5, 6]
  right_motor:
    topic: /piper/right_bus/motor_feedback
    timestamp: header
    sample: previous
    max_age_sec: 0.1
    order_field: joint_order
    order: [1, 2, 3, 4, 5, 6]

  cam_h_rgb: {topic: /cam_h/color/image_raw, timestamp: header, sample: nearest, max_age_sec: 0.05}
  cam_l_rgb: {topic: /cam_l/color/image_raw, timestamp: header, sample: nearest, max_age_sec: 0.05}
  cam_r_rgb: {topic: /cam_r/color/image_raw, timestamp: header, sample: nearest, max_age_sec: 0.05}
  cam_h_depth: {topic: /cam_h/depth/image_rect_raw, timestamp: header, sample: nearest, max_age_sec: 0.05}
  cam_l_depth: {topic: /cam_l/depth/image_rect_raw, timestamp: header, sample: nearest, max_age_sec: 0.05}
  cam_r_depth: {topic: /cam_r/depth/image_rect_raw, timestamp: header, sample: nearest, max_age_sec: 0.05}
  cam_h_aligned: {topic: /cam_h/aligned_depth_to_color/image_raw, timestamp: header, sample: nearest, max_age_sec: 0.05}
  cam_l_aligned: {topic: /cam_l/aligned_depth_to_color/image_raw, timestamp: header, sample: nearest, max_age_sec: 0.05}
  cam_r_aligned: {topic: /cam_r/aligned_depth_to_color/image_raw, timestamp: header, sample: nearest, max_age_sec: 0.05}

# 每个 feature 按下面的段顺序拼接；names 是输出维度名，order 是输入关节核对顺序。
# 状态/动作均为 [左 J1..J6, 左夹爪, 右 J1..J6, 右夹爪]，关节 rad、夹爪 m。
# action 是绝对位置指令回显，不是从臂实测位置，也不是下一帧状态。
vectors:
  observation.state:
    - {source: left_joints, field: position, names: &left_joints [left_joint_1, left_joint_2, left_joint_3, left_joint_4, left_joint_5, left_joint_6]}
    - {source: left_gripper, field: position, names: [left_gripper_width]}
    - {source: right_joints, field: position, names: &right_joints [right_joint_1, right_joint_2, right_joint_3, right_joint_4, right_joint_5, right_joint_6]}
    - {source: right_gripper, field: position, names: [right_gripper_width]}
  action:
    - {source: left_target, field: position, names: *left_joints}
    - {source: left_gripper_target, field: position, names: [left_gripper_width]}
    - {source: right_target, field: position, names: *right_joints}
    - {source: right_gripper_target, field: position, names: [right_gripper_width]}
  # 以下各 12 维，按 [左 J1..J6, 右 J1..J6]。不自动拼进 observation.state。
  observation.motor_current_a:
    - {source: left_motor, field: current_a, names: *left_joints}
    - {source: right_motor, field: current_a, names: *right_joints}
  observation.torque_estimate_nm:
    - {source: left_motor, field: torque_estimate_nm, names: *left_joints}
    - {source: right_motor, field: torque_estimate_nm, names: *right_joints}
  observation.motor_position_rad:
    - {source: left_motor, field: motor_position_rad, names: *left_joints}
    - {source: right_motor, field: motor_position_rad, names: *right_joints}
  observation.motor_velocity_rad_s:
    - {source: left_motor, field: motor_velocity_rad_s, names: *left_joints}
    - {source: right_motor, field: motor_velocity_rad_s, names: *right_joints}

images:
  observation.images.cam_h: {source: cam_h_rgb, kind: rgb, storage: video, enabled: true}
  observation.images.cam_l: {source: cam_l_rgb, kind: rgb, storage: video, enabled: true}
  observation.images.cam_r: {source: cam_r_rgb, kind: rgb, storage: video, enabled: true}
  # 改 enabled 为 true 即加入该深度源。uint16 / mm / 0 无效，image 模式无损保存。
  # 深度会成为额外视觉特征，训练时需明确选择 RGB 输入或适配深度模型。
  observation.depth.cam_h: {source: cam_h_depth, kind: depth, storage: image, enabled: false}
  observation.depth.cam_l: {source: cam_l_depth, kind: depth, storage: image, enabled: false}
  observation.depth.cam_r: {source: cam_r_depth, kind: depth, storage: image, enabled: false}
  observation.aligned_depth.cam_h: {source: cam_h_aligned, kind: depth, storage: image, enabled: false}
  observation.aligned_depth.cam_l: {source: cam_l_aligned, kind: depth, storage: image, enabled: false}
  observation.aligned_depth.cam_r: {source: cam_r_aligned, kind: depth, storage: image, enabled: false}
