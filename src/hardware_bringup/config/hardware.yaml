schema_version: 1
topology: independent_can
cameras:
  cam_h: {serial: '262522071923', role: third_person}
  cam_l: {serial: '262522071867', role: left_arm}
  cam_r: {serial: '262522070143', role: right_arm}
camera_settings:
  width: 640
  height: 480
  fps: 15
  align_depth: true
  startup_timeout_sec: 45.0
  stagger_sec: 3.0
arms:
  # 2026-10-19: identified by unplugging each USB adapter individually.
  left: {channel: can3, usb_path: '1-5.3:1.0', parser: v188, model: piper, firmware: S-V1.9-0, command_id_offset: 0, feedback_id_offset: 0}
  right: {channel: can0, usb_path: '1-5.2.2:1.0', parser: v188, model: piper, firmware: S-V1.9-0, command_id_offset: 0, feedback_id_offset: 0}
leaders:
  left: {channel: can1, usb_path: '1-5.4:1.0', parser: v188, model: piper, firmware: S-V1.9-0, command_id_offset: 0, feedback_id_offset: 0}
  right: {channel: can2, usb_path: '1-5.2.3:1.0', parser: v188, model: piper, firmware: S-V1.9-0, command_id_offset: 0, feedback_id_offset: 0}
arm_settings:
  bitrate: 1000000
  assembly_span_sec: 0.05
  max_sample_age_sec: 0.5
  can_recheck_sec: 5.0
  startup_timeout_sec: 30.0
monitor:
  stale_sec: 3.0
  minimum_samples: 3
  # Leader target topics are event-like: require observation at least once;
  # report their age but do not fabricate updates while stationary.
  leader_target_timeout_sec: 0.0
