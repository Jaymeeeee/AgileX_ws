schema_version: 1
cameras:
  cam_h: {serial: '262522071923', role: third_person}
  cam_l: {serial: '262522071867', role: left_arm}
  cam_r: {serial: '262522070143', role: right_arm}
camera_settings:
  width: 640
  height: 480
  fps: 15
  align_depth: true
  startup_timeout_sec: 45.0
  stagger_sec: 3.0
arms:
  # User confirmed standard Piper on both sides. Firmware version is still unverified.
  left: {channel: can0, parser: default, model: piper, firmware: unknown, command_id_offset: 0, feedback_id_offset: 0}
  right: {channel: can1, parser: default, model: piper, firmware: unknown, command_id_offset: 0, feedback_id_offset: 0}
arm_settings:
  bitrate: 1000000
  assembly_span_sec: 0.05
  max_sample_age_sec: 0.5
  can_recheck_sec: 5.0
  startup_timeout_sec: 30.0
monitor:
  stale_sec: 3.0
  minimum_samples: 3
  # Leader target topics are event-like: require observation at least once;
  # report their age but do not fabricate updates while stationary.
  leader_target_timeout_sec: 0.0
