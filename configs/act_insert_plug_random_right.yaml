# Right follower only; the final 60,000-step random-placement ACT checkpoint.
extends: act_right.yaml

robot:
  pairs:
    right:
      leader: false
      follower: true

policy:
  checkpoint: ../outputs/models/act_piper_insert_plug_random_20261027/checkpoints/060000/pretrained_model
  lerobot_source: ../third_party/lerobot

observation:
  task: 用右臂将插头插入插座
  state_names: [right_joint_1, right_joint_2, right_joint_3, right_joint_4, right_joint_5, right_joint_6, right_gripper_width]
