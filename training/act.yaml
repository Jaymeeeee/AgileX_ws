# Local LeRobot ACT baseline. Run using training/train_act.sh.
dataset:
  repo_id: local/piper_insert_plug
  root: /home/robot/AgileX_ws/datasets/piper_insert_plug
  video_backend: torchcodec
  eval_split: 0.1  # Episodes 0..17 train; 18..19 held out by LeRobot.
  use_imagenet_stats: true

policy:
  type: act
  device: cuda
  push_to_hub: false
  # Explicit inputs: extra motor/torque columns remain in the dataset but
  # are not inputs of this RGB + joint-state baseline.
  input_features:
    observation.state: {type: STATE, shape: [14]}
    observation.images.cam_h: {type: VISUAL, shape: [3, 480, 640]}
    observation.images.cam_l: {type: VISUAL, shape: [3, 480, 640]}
    observation.images.cam_r: {type: VISUAL, shape: [3, 480, 640]}
  output_features:
    action: {type: ACTION, shape: [14]}
  chunk_size: 100
  n_action_steps: 100
  optimizer_lr: 1.0e-5
  optimizer_lr_backbone: 1.0e-5
  optimizer_weight_decay: 1.0e-4

output_dir: /home/robot/AgileX_ws/outputs/act_piper_insert_plug_20261016
job_name: act_piper_insert_plug
seed: 1000
steps: 100000
batch_size: 8
num_workers: 4
prefetch_factor: 2
log_freq: 50
save_freq: 5000
eval_steps: 5000
max_eval_samples: 0  # Evaluate all held-out frames.
env_eval_freq: 0    # Offline training only; no robot/simulation control.
accelerator:
  mixed_precision: bf16
wandb:
  enable: false
